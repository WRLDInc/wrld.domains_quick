    <!-- Theme bootstrap: apply the saved theme before first paint. The design
         system ships light, dark and auto; auto follows the OS. -->
    <script>
      (function () {
        var theme = 'auto';
        try {
          var saved = localStorage.getItem('wrld-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
